name: Deploy Documentation Site

'on':
  push:
    branches:
      - main
      - ui-ux-improvements
    paths:
      - '_config.yml'
      - '_data/**'
      - '_layouts/**'
      - 'assets/**'
      - 'search-index.json'
      - 'docs/**'
      - 'README.md'
      - 'CHANGELOG.md'
      - 'CODE_OF_CONDUCT.md'
      - 'CONTRIBUTING.md'
      - 'SECURITY.md'
      - 'LICENSE'
      - 'build/Test-GeneratedSite.ps1'
      - '.github/workflows/deploy-documentation-site.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-documentation-site
  cancel-in-progress: true

jobs:
  build:
    name: Build Documentation Site
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Configure GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d

      - name: Build site with Jekyll
        uses: actions/jekyll-build-pages@44a6e6beabd48582f863aeeb6cb2151cc1716697
        with:
          source: ./
          destination: ./_site

      - name: Validate generated site integrity
        shell: pwsh
        run: ./build/Test-GeneratedSite.ps1

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9
        with:
          path: ./_site

  deploy:
    name: Deploy Documentation Site
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128

      - name: Smoke test published site
        shell: bash
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail
          base_url="${PAGE_URL%/}"
          routes=(
            ""
            "docs/security/installation-security.html"
            "docs/product/architecture.html"
            "docs/release/pages-deployment.html"
            "assets/search-index.json"
          )

          for route in "${routes[@]}"; do
            url="$base_url/$route"
            echo "Checking $url"
            body="$(curl --fail --silent --show-error --location --retry 5 --retry-delay 3 --retry-all-errors "$url")"
            if [[ "$route" == *.html || -z "$route" ]]; then
              grep -q 'class="content-prose"' <<< "$body" || {
                echo "Published HTML did not contain the expected content container: $url" >&2
                exit 1
              }
            fi
          done
