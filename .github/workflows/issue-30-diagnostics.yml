name: Issue 30 Analyzer Diagnostics

'on':
  push:
    branches:
      - issue-30/powershell-analyzer-policy

permissions:
  contents: write

jobs:
  diagnose:
    if: ${{ !contains(github.event.head_commit.message, '[skip diagnostics]') }}
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          ref: issue-30/powershell-analyzer-policy

      - name: Install development dependencies
        shell: pwsh
        run: ./build/Install-DevelopmentDependencies.ps1

      - name: Capture Information contract output
        shell: pwsh
        run: |
          $command = "Invoke-Pester -Path './tests/contract/PSScriptAnalyzerInformationPolicy.Tests.ps1' -Output Detailed"
          $output = & pwsh -NoLogo -NoProfile -Command $command 2>&1
          $output | Out-File -LiteralPath './issue-30-information-findings.txt' -Encoding utf8
          exit 0

      - name: Commit diagnostics
        shell: pwsh
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- issue-30-information-findings.txt
          git commit -m 'Record issue 30 analyzer diagnostics [skip diagnostics]'
          git push origin HEAD:issue-30/powershell-analyzer-policy
