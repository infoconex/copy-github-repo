name: Issue 30 Fix E2E Named Parameters

'on':
  push:
    branches:
      - issue-30/powershell-analyzer-policy

permissions:
  contents: write

jobs:
  fix:
    if: ${{ !contains(github.event.head_commit.message, '[skip e2e fix]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: issue-30/powershell-analyzer-policy
      - name: Convert demonstration helper calls to named parameters
        shell: pwsh
        run: |
          $path = Join-Path $PWD 'tests/e2e/Invoke-CleanSnapshotDemonstration.ps1'
          $content = Get-Content -LiteralPath $path -Raw
          $content = $content -replace 'Invoke-DemoNativeCommand git @\(', 'Invoke-DemoNativeCommand -FilePath git -ArgumentList @('
          $content = $content -replace 'Invoke-DemoNativeCommand gh @\(', 'Invoke-DemoNativeCommand -FilePath gh -ArgumentList @('
          $content = $content -replace '\) \$sourcePath(?=\s*(?:\||\)))', ') -WorkingDirectory $sourcePath'
          $content = $content -replace '\) \$destinationPath(?=\s*(?:\||\)))', ') -WorkingDirectory $destinationPath'
          [IO.File]::WriteAllText($path, $content, [Text.UTF8Encoding]::new($false))
      - name: Commit E2E fixes
        shell: pwsh
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- tests/e2e/Invoke-CleanSnapshotDemonstration.ps1
          git commit -m 'Use named parameters in snapshot demonstration [skip e2e fix]'
          git push origin HEAD:issue-30/powershell-analyzer-policy
