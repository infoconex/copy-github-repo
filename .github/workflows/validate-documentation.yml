name: Validate Documentation

'on':
  push:
    branches:
      - main
    paths:
      - '_config.yml'
      - '_data/**'
      - '_layouts/**'
      - 'assets/**'
      - 'search-index.json'
      - 'docs/**'
      - 'README.md'
      - 'CHANGELOG.md'
      - 'CODE_OF_CONDUCT.md'
      - 'CONTRIBUTING.md'
      - 'SECURITY.md'
      - 'LICENSE'
      - 'build/DevelopmentDependencies.psd1'
      - 'build/Install-DevelopmentDependencies.ps1'
      - 'build/Test-Documentation.ps1'
      - 'build/Test-GeneratedSite.ps1'
      - 'tests/contract/**'
      - '.github/workflows/validate-documentation.yml'
      - '.github/workflows/deploy-documentation-site.yml'
  pull_request:
    branches:
      - main
      - 'release/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-documentation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scope:
    name: Determine Documentation Scope
    runs-on: ubuntu-latest
    outputs:
      run-documentation: ${{ steps.scope.outputs.run-documentation }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: Determine whether documentation validation is required
        id: scope
        shell: pwsh
        run: |
          if ('${{ github.event_name }}' -ne 'pull_request') {
              'run-documentation=true' >> $env:GITHUB_OUTPUT
              exit 0
          }
          $baseSha = '${{ github.event.pull_request.base.sha }}'
          $headSha = '${{ github.event.pull_request.head.sha }}'
          $changedFiles = @(git diff --name-only $baseSha $headSha)
          if ($LASTEXITCODE -ne 0) {
              throw 'Unable to determine changed files for documentation validation.'
          }
          $documentationPattern = '^(?:_config\.yml$|_data/|_layouts/|assets/|search-index\.json$|docs/|README\.md$|CHANGELOG\.md$|CODE_OF_CONDUCT\.md$|CONTRIBUTING\.md$|SECURITY\.md$|LICENSE$|build/(?:DevelopmentDependencies\.psd1|Install-DevelopmentDependencies\.ps1|Test-Documentation\.ps1|Test-GeneratedSite\.ps1)$|tests/contract/|\.github/workflows/(?:validate-documentation|deploy-documentation-site)\.yml$)'
          $requiresDocumentation = @($changedFiles | Where-Object { $_ -match $documentationPattern }).Count -gt 0
          "run-documentation=$($requiresDocumentation.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT

  validate:
    name: Validate Documentation
    needs: scope
    if: ${{ needs.scope.outputs.run-documentation == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Resolve PowerShell module cache
        id: powershell-cache
        shell: pwsh
        run: |
          $modulePath = $env:PSModulePath -split [IO.Path]::PathSeparator | Select-Object -First 1
          if ([string]::IsNullOrWhiteSpace($modulePath)) {
              throw 'Unable to resolve the current-user PowerShell module path.'
          }

          "module-path=$modulePath" >> $env:GITHUB_OUTPUT
          "version=$($PSVersionTable.PSVersion)" >> $env:GITHUB_OUTPUT

      - name: Restore development dependency cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ${{ steps.powershell-cache.outputs.module-path }}
          key: powershell-dev-${{ runner.os }}-${{ steps.powershell-cache.outputs.version }}-${{ hashFiles('build/DevelopmentDependencies.psd1') }}

      - name: Install test dependencies
        shell: pwsh
        run: ./build/Install-DevelopmentDependencies.ps1

      - name: Run documentation validation
        shell: pwsh
        run: ./build/Test-Documentation.ps1

      - name: Configure GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d

      - name: Build site with Jekyll
        uses: actions/jekyll-build-pages@44a6e6beabd48582f863aeeb6cb2151cc1716697
        with:
          source: ./
          destination: ./_site

      - name: Validate generated site integrity
        shell: pwsh
        run: ./build/Test-GeneratedSite.ps1

      - name: Upload rendered PR preview
        if: ${{ github.event_name == 'pull_request' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: documentation-preview-pr-${{ github.event.pull_request.number }}
          path: _site/
          if-no-files-found: error
          retention-days: 14

      - name: Upload test diagnostics
        if: ${{ failure() || cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: documentation-test-results
          path: TestResults/
          if-no-files-found: warn
          retention-days: 14

  required-documentation:
    name: Required Documentation Gate
    needs: [scope, validate]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Verify documentation validation results
        shell: pwsh
        run: |
          if ('${{ needs.scope.result }}' -ne 'success') {
              throw 'Documentation scope determination did not succeed.'
          }
          $required = '${{ needs.scope.outputs.run-documentation }}'
          if ($required -notin @('true', 'false')) {
              throw 'Documentation scope result is invalid or missing.'
          }
          $expected = if ($required -eq 'true') { 'success' } else { 'skipped' }
          if ('${{ needs.validate.result }}' -ne $expected) {
              throw "Documentation validation result must be '$expected'."
          }
