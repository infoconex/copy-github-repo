name: Validate Project Quality

'on':
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
      - 'release/**'
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: validate-project-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scope:
    name: Determine Quality Scope
    runs-on: ubuntu-latest
    outputs:
      run-quality: ${{ steps.scope.outputs.run-quality }}

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Determine whether full quality validation is required
        id: scope
        shell: pwsh
        run: |
          if ('${{ github.event_name }}' -in @('workflow_dispatch', 'workflow_call')) {
              'run-quality=true' >> $env:GITHUB_OUTPUT
              exit 0
          }

          if ('${{ github.event_name }}' -eq 'pull_request') {
              $baseSha = '${{ github.event.pull_request.base.sha }}'
              $headSha = '${{ github.event.pull_request.head.sha }}'
          }
          else {
              $baseSha = '${{ github.event.before }}'
              $headSha = '${{ github.sha }}'
          }

          if ($baseSha -eq ('0' * 40)) {
              'run-quality=true' >> $env:GITHUB_OUTPUT
              exit 0
          }

          $changedFiles = @(git diff --name-only $baseSha $headSha)
          if ($LASTEXITCODE -ne 0) {
              throw 'Unable to determine changed files for quality-scope evaluation.'
          }

          $siteOnlyPattern = '^(?:_config\.yml|_data/|_layouts/|assets/|search-index\.json$|docs/|README\.md$|CHANGELOG\.md$|CODE_OF_CONDUCT\.md$|CONTRIBUTING\.md$|SECURITY\.md$|LICENSE$|\.github/workflows/(?:deploy-documentation-site|validate-documentation)\.yml$)'
          $requiresQuality = @($changedFiles | Where-Object { $_ -notmatch $siteOnlyPattern }).Count -gt 0
          "run-quality=$($requiresQuality.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT

  windows:
    name: Validate PowerShell (windows-latest)
    needs: scope
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Record documentation-only validation
        if: ${{ needs.scope.outputs.run-quality != 'true' }}
        shell: pwsh
        run: Write-Host 'Full PowerShell quality validation is not required for documentation-only changes.'

      - name: Check out repository
        if: ${{ needs.scope.outputs.run-quality == 'true' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Resolve PowerShell module cache
        if: ${{ needs.scope.outputs.run-quality == 'true' }}
        id: powershell-cache
        shell: pwsh
        run: |
          $modulePath = $env:PSModulePath -split [IO.Path]::PathSeparator | Select-Object -First 1
          if ([string]::IsNullOrWhiteSpace($modulePath)) {
              throw 'Unable to resolve the current-user PowerShell module path.'
          }

          "module-path=$modulePath" >> $env:GITHUB_OUTPUT
          "version=$($PSVersionTable.PSVersion)" >> $env:GITHUB_OUTPUT

      - name: Restore development dependency cache
        if: ${{ needs.scope.outputs.run-quality == 'true' }}
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ${{ steps.powershell-cache.outputs.module-path }}
          key: powershell-dev-${{ runner.os }}-${{ steps.powershell-cache.outputs.version }}-${{ hashFiles('build/DevelopmentDependencies.psd1') }}

      - name: Install test dependencies
        if: ${{ needs.scope.outputs.run-quality == 'true' }}
        shell: pwsh
        run: ./build/Install-DevelopmentDependencies.ps1

      - name: Static analysis
        if: ${{ needs.scope.outputs.run-quality == 'true' }}
        shell: pwsh
        run: ./build/Test-Project.ps1 -AnalysisOnly

      - name: Unit tests
        if: ${{ needs.scope.outputs.run-quality == 'true' }}
        shell: pwsh
        run: ./build/Test-Project.ps1 -Category Unit -SkipAnalysis -CollectCoverage

      - name: Integration tests
        if: ${{ needs.scope.outputs.run-quality == 'true' }}
        shell: pwsh
        run: ./build/Test-Project.ps1 -Category Integration -SkipAnalysis -CollectCoverage

      - name: Contract tests
        if: ${{ needs.scope.outputs.run-quality == 'true' }}
        shell: pwsh
        run: ./build/Test-Project.ps1 -Category Contract -SkipAnalysis -CollectCoverage

      - name: Code coverage
        if: ${{ needs.scope.outputs.run-quality == 'true' }}
        shell: pwsh
        run: ./build/Test-Project.ps1 -CoverageOnly

      - name: Build and validate PowerShell Gallery package
        if: ${{ needs.scope.outputs.run-quality == 'true' }}
        shell: pwsh
        run: ./build/New-PowerShellGalleryPackage.ps1 | Format-List

      - name: Upload test diagnostics
        if: ${{ (failure() || cancelled()) && needs.scope.outputs.run-quality == 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: test-results-windows-latest
          path: TestResults/
          if-no-files-found: warn
          retention-days: 14

  other-platforms:
    name: Validate PowerShell (${{ matrix.os }})
    needs: scope
    if: ${{ needs.scope.outputs.run-quality == 'true' }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Resolve PowerShell module cache
        id: powershell-cache
        shell: pwsh
        run: |
          $modulePath = $env:PSModulePath -split [IO.Path]::PathSeparator | Select-Object -First 1
          if ([string]::IsNullOrWhiteSpace($modulePath)) {
              throw 'Unable to resolve the current-user PowerShell module path.'
          }

          "module-path=$modulePath" >> $env:GITHUB_OUTPUT
          "version=$($PSVersionTable.PSVersion)" >> $env:GITHUB_OUTPUT

      - name: Restore development dependency cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ${{ steps.powershell-cache.outputs.module-path }}
          key: powershell-dev-${{ runner.os }}-${{ steps.powershell-cache.outputs.version }}-${{ hashFiles('build/DevelopmentDependencies.psd1') }}

      - name: Install test dependencies
        shell: pwsh
        run: ./build/Install-DevelopmentDependencies.ps1

      - name: Unit tests
        shell: pwsh
        run: ./build/Test-Project.ps1 -Category Unit -SkipAnalysis

      - name: Integration tests
        shell: pwsh
        run: ./build/Test-Project.ps1 -Category Integration -SkipAnalysis

      - name: Contract tests
        shell: pwsh
        run: ./build/Test-Project.ps1 -Category Contract -SkipAnalysis

      - name: Build and validate PowerShell Gallery package
        shell: pwsh
        run: ./build/New-PowerShellGalleryPackage.ps1 | Format-List

      - name: Upload test diagnostics
        if: ${{ failure() || cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: test-results-${{ matrix.os }}
          path: TestResults/
          if-no-files-found: warn
          retention-days: 14
