name: Validate Project Quality

'on':
  push:
    branches:
      - main
    paths-ignore:
      - '_config.yml'
      - '_data/**'
      - '_layouts/**'
      - 'assets/**'
      - 'docs/**'
      - 'README.md'
      - 'CHANGELOG.md'
      - 'CODE_OF_CONDUCT.md'
      - 'CONTRIBUTING.md'
      - 'SECURITY.md'
      - 'LICENSE'
      - '.github/workflows/deploy-documentation-site.yml'
      - '.github/workflows/validate-documentation.yml'
  pull_request:
    branches:
      - main
    paths-ignore:
      - '_config.yml'
      - '_data/**'
      - '_layouts/**'
      - 'assets/**'
      - 'docs/**'
      - 'README.md'
      - 'CHANGELOG.md'
      - 'CODE_OF_CONDUCT.md'
      - 'CONTRIBUTING.md'
      - 'SECURITY.md'
      - 'LICENSE'
      - '.github/workflows/deploy-documentation-site.yml'
      - '.github/workflows/validate-documentation.yml'
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: validate-project-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Validate PowerShell (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-latest
          - ubuntu-latest
          - macos-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Resolve PowerShell module cache
        id: powershell-cache
        shell: pwsh
        run: |
          $modulePath = $env:PSModulePath -split [IO.Path]::PathSeparator | Select-Object -First 1
          if ([string]::IsNullOrWhiteSpace($modulePath)) {
              throw 'Unable to resolve the current-user PowerShell module path.'
          }

          "module-path=$modulePath" >> $env:GITHUB_OUTPUT
          "version=$($PSVersionTable.PSVersion)" >> $env:GITHUB_OUTPUT

      - name: Restore development dependency cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ${{ steps.powershell-cache.outputs.module-path }}
          key: powershell-dev-${{ runner.os }}-${{ steps.powershell-cache.outputs.version }}-${{ hashFiles('build/DevelopmentDependencies.psd1') }}

      - name: Install test dependencies
        shell: pwsh
        run: ./build/Install-DevelopmentDependencies.ps1

      - name: Validate project quality
        shell: pwsh
        run: ./build/Test-Project.ps1

      - name: Build and validate PowerShell Gallery package
        shell: pwsh
        run: ./build/New-PowerShellGalleryPackage.ps1 | Format-List

      - name: Upload test diagnostics
        if: ${{ failure() || cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: test-results-${{ matrix.os }}
          path: TestResults/
          if-no-files-found: warn
          retention-days: 14
