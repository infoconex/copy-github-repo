title: Copy GitHub Repository
description: PowerShell module for safely copying and migrating GitHub repositories with clean Snapshot or history-preserving FullHistory modes.
url: https://infoconex.github.io
baseurl: /copy-github-repo
repository: infoconex/copy-github-repo
google_analytics: G-N3DS7SRG3K

markdown: kramdown
highlighter: rouge

kramdown:
  input: GFM
  syntax_highlighter: rouge

plugins:
  - jekyll-seo-tag
  - jekyll-relative-links
  - jekyll-sitemap

relative_links:
  enabled: true
  collections: true

# Apply the documentation layout to existing Markdown without requiring
# front matter in every repository document.
defaults:
  - scope:
      path: ""
    values:
      layout: default

exclude:
  - Gemfile
  - Gemfile.lock
  - build
  - src
  - tests
  - tools
  - install.ps1
  - install-release.ps1
  - install-prerelease.ps1
  - uninstall.ps1
  - copy-github-repo.ps1
  - PSScriptAnalyzerSettings.psd1
