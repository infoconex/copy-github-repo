title: Copy GitHub Repository
description: PowerShell module for safely copying and migrating GitHub repositories with clean Snapshot or history-preserving FullHistory modes.
url: https://infoconex.github.io
baseurl: /copy-github-repo
repository: infoconex/copy-github-repo
google_analytics: G-N3DS7SRG3K

markdown: kramdown
highlighter: rouge

kramdown:
  input: GFM
  syntax_highlighter: rouge

plugins:
  - jekyll-seo-tag
  - jekyll-relative-links
  - jekyll-sitemap

relative_links:
  enabled: true
  collections: true

# GitHub Pages enables jekyll-readme-index by default. Allow the root README
# to remain the site index now that it carries explicit SEO front matter.
readme_index:
  with_frontmatter: true

# Apply the documentation layout and social preview image by default so
# published Markdown pages only need page-specific metadata in front matter.
defaults:
  - scope:
      path: ""
    values:
      layout: default
      image: /assets/images/social-preview.png

exclude:
  - Gemfile
  - Gemfile.lock
  - build
  - src
  - tests
  - tools
  - install.ps1
  - install-release.ps1
  - install-prerelease.ps1
  - uninstall.ps1
  - copy-github-repo.ps1
  - PSScriptAnalyzerSettings.psd1
